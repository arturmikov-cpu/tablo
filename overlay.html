<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Football Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Прозрачный фон для OBS */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw; /* Подстраивается под размер Browser Source в OBS */
            height: 100vh;
        }

        /* Контейнер позиционирования */
        #wrapper {
            position: absolute;
            transition: all 0.3s ease;
        }
        .pos-top-left { top: 40px; left: 40px; }
        .pos-top-center { top: 40px; left: 50%; transform: translateX(-50%); }
        .pos-top-right { top: 40px; right: 40px; }

        /* Базовый стиль табло */
        #scoreboard {
            display: flex;
            align-items: center;
            padding: 12px 35px;
            border-radius: 8px;
            gap: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: background-color 0.3s, border 0.3s;
            background-color: #1a1a1a; /* Дефолтный цвет */
        }

        /* Элементы табло */
        .team-block { display: flex; align-items: center; gap: 12px; }
        .team-name { font-size: 28px; font-weight: bold; text-transform: uppercase; transition: color 0.3s; color: #ffffff; }
        .form-marker { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); display: none; }
        .score { font-size: 38px; font-weight: 900; transition: color 0.3s; color: #ffffff; min-width: 25px; text-align: center; }
        .timer-block { font-size: 32px; font-weight: bold; padding: 0 15px; border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3); transition: color 0.3s; color: #ffffff; }

        /* Анимация изменения счета */
        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); filter: brightness(1.5); }
            100% { transform: scale(1); }
        }
        .score-animate { animation: scorePop 0.4s ease-out; }

        /* --- ДИЗАЙНЫ --- */
        .design-1 { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .design-2 { background: rgba(255,255,255,0.1) !important; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        .design-3 { background: #0d0d0d !important; border: 2px solid #00f3ff; box-shadow: 0 0 15px #00f3ff inset, 0 0 15px #00f3ff; }
        .design-4 { border-radius: 0 !important; border: 4px solid white; box-shadow: 8px 8px 0 rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div id="wrapper" class="pos-top-left">
        <div id="scoreboard" class="design-1">
            <div class="team-block">
                <span id="homeName" class="team-name">ХОЗЯЕВА</span>
                <span id="homeScore" class="score">0</span>
            </div>
            <div id="timer" class="timer-block">00:00</div>
            <div class="team-block">
                <span id="awayScore" class="score">0</span>
                <span id="awayName" class="team-name">ГОСТИ</span>
                <div id="awayMarker" class="form-marker"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBf90bqaBPXIPiU2Y84CV1cVU7hVmxn8Vk",
            authDomain: "tablok4tv.firebaseapp.com",
            databaseURL: "https://tablok4tv-default-rtdb.firebaseio.com",
            projectId: "tablok4tv",
            storageBucket: "tablok4tv.firebasestorage.app",
            messagingSenderId: "449837394917",
            appId: "1:449837394917:web:b5115ffd8de2c001919d0c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('match');

        let prevHomeScore = -1, prevAwayScore = -1;
        let timerInterval = null;

        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startLocalTimer(startTime, elapsed) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const currentElapsed = elapsed + (Date.now() - startTime);
                document.getElementById('timer').innerText = formatTime(currentElapsed);
            }, 100);
        }

        // Инициализация значений по умолчанию, если база пуста
        db.once('value').then(snapshot => {
            if (!snapshot.exists()) {
                db.set({
                    homeTeam: "ХОЗЯЕВА", awayTeam: "ГОСТИ", homeScore: 0, awayScore: 0,
                    awayFormColor: "#ffffff", design: "1", position: "top-left",
                    timer: { isRunning: false, startTime: 0, elapsed: 0 },
                    colors: { bg: "#1a1a1a", timerFont: "#ffffff", teamFont: "#ffffff" }
                });
            }
        });

        // Основной слушатель изменений
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return; // Защита от ошибки при удалении данных
            
            // Имена
            document.getElementById('homeName').innerText = data.homeTeam || 'ХОЗЯЕВА';
            document.getElementById('awayName').innerText = data.awayTeam || 'ГОСТИ';
            
            // Метка формы
            const marker = document.getElementById('awayMarker');
            if (data.awayFormColor && data.awayFormColor !== 'transparent') {
                marker.style.backgroundColor = data.awayFormColor;
                marker.style.display = 'block';
            } else {
                marker.style.display = 'none';
            }

            // Цвета
            const colors = data.colors || {};
            document.getElementById('scoreboard').style.backgroundColor = colors.bg || '#1a1a1a';
            document.getElementById('timer').style.color = colors.timerFont || '#ffffff';
            document.querySelectorAll('.team-name').forEach(el => el.style.color = colors.teamFont || '#ffffff');
            document.querySelectorAll('.score').forEach(el => el.style.color = colors.timerFont || '#ffffff');

            // Дизайн и Позиция
            document.getElementById('scoreboard').className = `design-${data.design || 1}`;
            document.getElementById('wrapper').className = `pos-${data.position || 'top-left'}`;

            // Счет с анимацией
            const hs = data.homeScore || 0;
            const as = data.awayScore || 0;

            if (hs !== prevHomeScore && prevHomeScore !== -1) {
                const el = document.getElementById('homeScore');
                el.classList.remove('score-animate');
                void el.offsetWidth;
                el.classList.add('score-animate');
            }
            if (as !== prevAwayScore && prevAwayScore !== -1) {
                const el = document.getElementById('awayScore');
                el.classList.remove('score-animate');
                void el.offsetWidth;
                el.classList.add('score-animate');
            }
            document.getElementById('homeScore').innerText = hs;
            document.getElementById('awayScore').innerText = as;
            prevHomeScore = hs;
            prevAwayScore = as;

            // Таймер
            const timerData = data.timer || {};
            if (timerData.isRunning) {
                startLocalTimer(timerData.startTime, timerData.elapsed || 0);
            } else {
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = formatTime(timerData.elapsed || 0);
            }
        });
    </script>
</body>
</html>
