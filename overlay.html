<script>
    const firebaseConfig = { apiKey: "AIzaSyBf90bqaBPXIPiU2Y84CV1cVU7hVmxn8Vk", authDomain: "tablok4tv.firebaseapp.com", databaseURL: "https://tablok4tv-default-rtdb.firebaseio.com", projectId: "tablok4tv", storageBucket: "tablok4tv.firebasestorage.app", messagingSenderId: "449837394917", appId: "1:449837394917:web:b5115ffd8de2c001919d0c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('match');

    let prevHomeScore = -1, prevAwayScore = -1;
    let mainTimerInterval = null, addedTimerInterval = null;

    const statTypes = [
      { key: 'score', label: 'Счёт' },
      { key: 'shots', label: 'Удары' },
      { key: 'corners', label: 'Угловые' },
      { key: 'offsides', label: 'Оффсайды' },
      { key: 'fouls', label: 'Наруш.' },
      { key: 'yellowCards', label: 'ЖК' },
      { key: 'redCards', label: 'КК' }
    ];

    const summaryRowsContainer = document.getElementById('summary-stats-rows');
    statTypes.forEach(s => {
      summaryRowsContainer.innerHTML += `<div class="summary-row" id="sum-row-${s.key}"><span class="summary-val" id="sum-${s.key}-home">0</span><span class="summary-label">${s.label}</span><span class="summary-val" id="sum-${s.key}-away">0</span></div>`;
    });

    function formatTime(ms) { const totalSec = Math.max(0, Math.floor(ms / 1000)); const m = Math.floor(totalSec / 60); const s = totalSec % 60; return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; }
    function applyMarker(id, c) { const m = document.getElementById(id); if(c && c!=='transparent'){m.style.backgroundColor=c;m.style.display='block';}else{m.style.display='none';} }
    function applyLogo(id, u) { const i = document.getElementById(id); if(u&&u.trim()!==''){i.src=u;i.style.display='block';}else{i.style.display='none';} }

    db.once('value').then(s => { if(!s.exists()){ db.set({ homeTeam:"ХОЗЯЕВА", awayTeam:"ГОСТИ", homeScore:0, awayScore:0, homeFormColor:"transparent", awayFormColor:"transparent", homeLogo:"", awayLogo:"", tournamentName:"", design:"1", position:"top-left", overlayState:"main", timer:{isRunning:false,startTime:0,elapsed:0,manualStartMin:0,maxMinutes:90}, addedTime:{isActive:false,minutes:0,isRunning:false,startTime:0,elapsed:0}, colors:{bg:"#1a1a1a",timerFont:"#ffffff",teamFont:"#ffffff"}, stats:{ score:{isVisible:false}, shots:{home:0,away:0,isVisible:false}, corners:{home:0,away:0,isVisible:false}, offsides:{home:0,away:0,isVisible:false}, fouls:{home:0,away:0,isVisible:false}, yellowCards:{home:0,away:0,isVisible:false}, redCards:{home:0,away:0,isVisible:false} } }); }});

    db.on('value', (snapshot) => {
        const data = snapshot.val(); if(!data) return;
        const state = data.overlayState || 'main';
        const mainC = document.getElementById('scoreboard-container');
        const nsO = document.getElementById('notstarted-overlay');
        const htO = document.getElementById('halftime-overlay');
        const ftO = document.getElementById('fulltime-overlay');
        const htBO = document.getElementById('halftime-bottom-overlay');
        const ftBO = document.getElementById('fulltime-bottom-overlay');
        const sumO = document.getElementById('stats-summary-overlay');

        mainC.style.display='none'; nsO.style.display='none'; htO.style.display='none'; ftO.style.display='none'; htBO.style.display='none'; ftBO.style.display='none'; sumO.style.display='none';

        if(state==='notstarted') nsO.style.display='flex';
        else if(state==='halftime') htO.style.display='flex';
        else if(state==='fulltime') ftO.style.display='flex';
        else if(state==='halftime-bottom') htBO.style.display='grid';
        else if(state==='fulltime-bottom') ftBO.style.display='grid';
        else if(state==='stats-summary') sumO.style.display='flex';
        else if(state==='hidden') {}
        else mainC.style.display='block';

        document.getElementById('homeName').innerText = data.homeTeam||'ХОЗЯЕВА';
        document.getElementById('awayName').innerText = data.awayTeam||'ГОСТИ';
        applyMarker('homeMarker', data.homeFormColor); applyMarker('awayMarker', data.awayFormColor);
        const colors = data.colors||{};
        document.getElementById('scoreboard').style.backgroundColor=colors.bg||'#1a1a1a';
        document.getElementById('timer').style.color=colors.timerFont||'#ffffff';
        document.querySelectorAll('.team-name').forEach(el=>el.style.color=colors.teamFont||'#ffffff');
        document.querySelectorAll('.score').forEach(el=>el.style.color=colors.timerFont||'#ffffff');
        document.getElementById('scoreboard').className=`design-${data.design||1}`;
        document.getElementById('wrapper').className=`pos-${data.position||'top-left'}`;

        const hs=data.homeScore||0, as=data.awayScore||0;
        if(hs!==prevHomeScore&&prevHomeScore!==-1){const e=document.getElementById('homeScore');e.classList.remove('score-animate');void e.offsetWidth;e.classList.add('score-animate');}
        if(as!==prevAwayScore&&prevAwayScore!==-1){const e=document.getElementById('awayScore');e.classList.remove('score-animate');void e.offsetWidth;e.classList.add('score-animate');}
        document.getElementById('homeScore').innerText=hs; document.getElementById('awayScore').innerText=as; prevHomeScore=hs; prevAwayScore=as;

        const teamN=data.homeTeam||'ХОЗЯЕВА', teamA=data.awayTeam||'ГОСТИ', tournament=data.tournamentName||'';
        ['ns','ht','ft','htb','ftb'].forEach(p=>{ document.getElementById(`${p}-home-name`).innerText=teamN; document.getElementById(`${p}-away-name`).innerText=teamA; document.getElementById(`${p}-home-score`).innerText=hs; document.getElementById(`${p}-away-score`).innerText=as; applyLogo(`${p}-home-logo`,data.homeLogo); applyLogo(`${p}-away-logo`,data.awayLogo); });
        ['ns','ht','ft'].forEach(p=>{ const tEl=document.getElementById(`${p}-tournament`); if(tournament.trim()!==''){tEl.innerText=tournament;tEl.style.display='block';}else{tEl.style.display='none';} });

        clearInterval(mainTimerInterval); const td=data.timer||{}; const baseMs=((td.manualStartMin||0)*60000); const maxMs=((td.maxMinutes||999)*60000);
        if(td.isRunning){mainTimerInterval=setInterval(()=>{let c=baseMs+(td.elapsed||0)+(Date.now()-td.startTime);if(c>=maxMs){c=maxMs;clearInterval(mainTimerInterval);db.child('timer').update({isRunning:false,elapsed:maxMs-baseMs,startTime:0});}document.getElementById('timer').innerText=formatTime(c);},100);}else{document.getElementById('timer').innerText=formatTime(baseMs+(td.elapsed||0));}
        clearInterval(addedTimerInterval); const at=data.addedTime||{}; const atB=document.getElementById('addedTimeBlock');
        if(at.isActive&&at.minutes>0){atB.style.display='block';document.getElementById('addedTimeVal').innerText=`+${at.minutes}`;if(at.isRunning){addedTimerInterval=setInterval(()=>{document.getElementById('addedTimer').innerText=formatTime((at.elapsed||0)+(Date.now()-at.startTime));},100);}else{document.getElementById('addedTimer').innerText=formatTime(at.elapsed||0);}}else{atB.style.display='none';}

        // --- СТАТИСТИКА ---
        const stats = data.stats || {};
        const modContainer = document.getElementById('stats-modular-container');
        modContainer.innerHTML = ''; 
        let hasModularStats = false;

        statTypes.forEach(s => {
            let d, hVal, aVal;
            if (s.key === 'score') {
                d = stats.score || { isVisible: false };
                hVal = hs; aVal = as;
            } else {
                d = stats[s.key] || { home: 0, away: 0, isVisible: false };
                hVal = d.home || 0; aVal = d.away || 0;
            }
            
            if (d.isVisible && state === 'main') {
                hasModularStats = true;
                modContainer.innerHTML += `<div class="stat-modular-item"><span class="stat-mod-val">${hVal}</span><span class="stat-mod-label">${s.label}</span><span class="stat-mod-val">${aVal}</span></div>`;
            }

            document.getElementById(`sum-${s.key}-home`).innerText = hVal;
            document.getElementById(`sum-${s.key}-away`).innerText = aVal;
        });

        document.getElementById('sum-home-name').innerText = teamN;
        document.getElementById('sum-away-name').innerText = teamA;
        document.getElementById('sum-home-score').innerText = hs;
        document.getElementById('sum-away-score').innerText = as;

        modContainer.style.display = hasModularStats ? 'flex' : 'none';

        const poss = stats.possession || { home: 50, away: 50, isVisible: false };
        const possC = document.getElementById('possession-container');
        if (poss.isVisible && state === 'main') {
            possC.style.display = 'flex';
            const hBar = document.getElementById('poss-home-bar');
            const aBar = document.getElementById('poss-away-bar');
            hBar.style.width = poss.home + '%'; hBar.style.background = data.homeFormColor || '#ff0000'; hBar.innerText = poss.home + '%';
            aBar.style.width = poss.away + '%'; aBar.style.background = data.awayFormColor || '#00ffff'; aBar.innerText = poss.away + '%';
        } else { possC.style.display = 'none'; }
    });
</script>
