<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Football Overlay</title>
    <style>
        body { margin: 0; padding: 0; background-color: transparent; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #wrapper { position: absolute; transition: all 0.3s ease; }
        .pos-top-left { top: 40px; left: 40px; } .pos-top-center { top: 40px; left: 50%; transform: translateX(-50%); } .pos-top-right { top: 40px; right: 40px; }

        #scoreboard-container { transition: opacity 0.3s; }
        #scoreboard { display: flex; align-items: center; padding: 12px 35px; border-radius: 8px; gap: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: background-color 0.3s; background-color: #1a1a1a; }
        .team-block { display: flex; align-items: center; gap: 12px; }
        .team-name { font-size: 28px; font-weight: bold; text-transform: uppercase; transition: color 0.3s; color: #ffffff; }
        .form-marker { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); display: none; }
        .score { font-size: 38px; font-weight: 900; transition: color 0.3s; color: #ffffff; min-width: 25px; text-align: center; }
        .timer-container { display: flex; flex-direction: column; align-items: center; }
        .timer-block { font-size: 32px; font-weight: bold; padding: 0 15px; border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3); transition: color 0.3s; color: #ffffff; }
        .added-time-block { font-size: 16px; font-weight: bold; color: #ffdd57; margin-top: 4px; display: none; }
        @keyframes scorePop { 0% { transform: scale(1); } 50% { transform: scale(1.4); filter: brightness(1.5); } 100% { transform: scale(1); } }
        .score-animate { animation: scorePop 0.4s ease-out; }
        .design-1 { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .design-2 { background: rgba(255,255,255,0.1) !important; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        .design-3 { background: #0d0d0d !important; border: 2px solid #00f3ff; box-shadow: 0 0 15px #00f3ff inset, 0 0 15px #00f3ff; }
        .design-4 { border-radius: 50px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .big-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); padding: 60px 120px; border-radius: 20px; display: none; flex-direction: column; align-items: center; gap: 30px; color: white; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 60px rgba(0,0,0,0.8); animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .big-overlay-teams { display: flex; align-items: center; justify-content: center; gap: 50px; width: 100%; }
        .big-team-card { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .big-logo { width: 100px; height: 100px; object-fit: contain; }
        .big-team-name { font-size: 32px; font-weight: bold; text-transform: uppercase; }
        .big-score-block { font-size: 64px; font-weight: 900; display: flex; align-items: center; gap: 20px; }
        .big-score-separator { font-size: 40px; opacity: 0.5; }
        .big-status-text { font-size: 48px; font-weight: 900; letter-spacing: 5px; color: #ffdd57; text-transform: uppercase; text-shadow: 0 0 10px rgba(255, 221, 87, 0.5); }
        .big-tournament-text { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.7); text-align: center; display: none; }

        .bottom-overlay { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 10, 0.75); backdrop-filter: blur(15px); padding: 20px 40px; border-radius: 15px; display: none; grid-template-columns: auto 350px auto; align-items: center; color: white; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 40px rgba(0,0,0,0.8); animation: fadeInBottom 0.5s ease-out; width: fit-content; max-width: 95vw; }
        @keyframes fadeInBottom { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .bottom-team-group { display: flex; align-items: center; gap: 15px; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bottom-team-group.home { justify-content: flex-end; padding-right: 15px; }
        .bottom-team-group.away { justify-content: flex-start; padding-left: 15px; }
        .bottom-logo { width: 50px; height: 50px; object-fit: contain; flex-shrink: 0; }
        .bottom-team-name { font-size: 26px; font-weight: bold; text-transform: uppercase; }
        .bottom-center-box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.95); padding: 12px 35px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 25px rgba(0,0,0,0.6); z-index: 2; max-width: 340px; width: max-content; }
        .bottom-status-text { font-size: 22px; font-weight: 900; color: #ffdd57; text-transform: uppercase; letter-spacing: 2px; }
        .bottom-score-box { background: transparent; padding: 0; border-radius: 0; font-size: 36px; font-weight: 900; display: flex; align-items: center; gap: 15px; }
        .bottom-score-sep { opacity: 0.5; font-size: 24px; }

        #stats-modular-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; gap: 10px; align-items: center; z-index: 50; width: fit-content; }
        .stat-modular-item { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); padding: 10px 30px; border-radius: 10px; display: flex; align-items: center; gap: 30px; color: white; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(0,0,0,0.8); animation: fadeInBottom 0.3s ease-out; }
        .stat-mod-val { font-size: 28px; font-weight: 900; min-width: 30px; text-align: center; }
        .stat-mod-label { font-size: 18px; font-weight: 500; color: #ffdd57; text-transform: uppercase; }

        #possession-container { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 60vw; height: 30px; display: none; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); z-index: 50; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .poss-bar { height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); font-size: 14px; transition: width 0.5s ease; }

        #stats-summary-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); padding: 40px 60px; border-radius: 20px; display: none; flex-direction: column; gap: 20px; color: white; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 60px rgba(0,0,0,0.8); animation: fadeIn 0.5s ease-out; width: 600px; }
        .summary-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.2); margin-bottom: 10px; }
        .summary-team-name { font-size: 24px; font-weight: bold; text-transform: uppercase; }
        .summary-score { font-size: 36px; font-weight: 900; color: #ffdd57; }
        .summary-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 15px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .summary-val { font-size: 22px; font-weight: 900; text-align: center; }
        .summary-label { font-size: 16px; color: rgba(255,255,255,0.6); text-align: center; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="wrapper" class="pos-top-left">
        <div id="scoreboard-container">
            <div id="scoreboard" class="design-1">
                <div class="team-block"><div id="homeMarker" class="form-marker"></div><span id="homeName" class="team-name">ХОЗЯЕВА</span><span id="homeScore" class="score">0</span></div>
                <div class="timer-container"><div id="timer" class="timer-block">00:00</div><div id="addedTimeBlock" class="added-time-block">д.в. <span id="addedTimeVal">+0</span> (<span id="addedTimer">00:00</span>)</div></div>
                <div class="team-block"><span id="awayScore" class="score">0</span><span id="awayName" class="team-name">ГОСТИ</span><div id="awayMarker" class="form-marker"></div></div>
            </div>
        </div>
    </div>

    <div id="notstarted-overlay" class="big-overlay"><div class="big-overlay-teams"><div class="big-team-card"><img id="ns-home-logo" class="big-logo" src="" style="display:none;"><span id="ns-home-name" class="big-team-name">ХОЗЯЕВА</span></div><div class="big-score-block"><span id="ns-home-score">0</span><span class="big-score-separator">:</span><span id="ns-away-score">0</span></div><div class="big-team-card"><img id="ns-away-logo" class="big-logo" src="" style="display:none;"><span id="ns-away-name" class="big-team-name">ГОСТИ</span></div></div><div class="big-status-text">МАТЧ НЕ НАЧАЛСЯ</div><div id="ns-tournament" class="big-tournament-text"></div></div>
    <div id="halftime-overlay" class="big-overlay"><div class="big-overlay-teams"><div class="big-team-card"><img id="ht-home-logo" class="big-logo" src="" style="display:none;"><span id="ht-home-name" class="big-team-name">ХОЗЯЕВА</span></div><div class="big-score-block"><span id="ht-home-score">0</span><span class="big-score-separator">:</span><span id="ht-away-score">0</span></div><div class="big-team-card"><img id="ht-away-logo" class="big-logo" src="" style="display:none;"><span id="ht-away-name" class="big-team-name">ГОСТИ</span></div></div><div class="big-status-text">ПЕРЕРЫВ</div><div id="ht-tournament" class="big-tournament-text"></div></div>
    <div id="fulltime-overlay" class="big-overlay"><div class="big-overlay-teams"><div class="big-team-card"><img id="ft-home-logo" class="big-logo" src="" style="display:none;"><span id="ft-home-name" class="big-team-name">ХОЗЯЕВА</span></div><div class="big-score-block"><span id="ft-home-score">0</span><span class="big-score-separator">:</span><span id="ft-away-score">0</span></div><div class="big-team-card"><img id="ft-away-logo" class="big-logo" src="" style="display:none;"><span id="ft-away-name" class="big-team-name">ГОСТИ</span></div></div><div class="big-status-text">МАТЧ ОКОНЧЕН</div><div id="ft-tournament" class="big-tournament-text"></div></div>

    <div id="halftime-bottom-overlay" class="bottom-overlay"><div class="bottom-team-group home"><img id="htb-home-logo" class="bottom-logo" src="" style="display:none;"><span id="htb-home-name" class="bottom-team-name">ХОЗЯЕВА</span></div><div class="bottom-center-spacer"></div><div class="bottom-team-group away"><span id="htb-away-name" class="bottom-team-name">ГОСТИ</span><img id="htb-away-logo" class="bottom-logo" src="" style="display:none;"></div><div class="bottom-center-box"><span class="bottom-status-text">ПЕРЕРЫВ</span><div class="bottom-score-box"><span id="htb-home-score">0</span><span class="bottom-score-sep">:</span><span id="htb-away-score">0</span></div></div></div>
    <div id="fulltime-bottom-overlay" class="bottom-overlay"><div class="bottom-team-group home"><img id="ftb-home-logo" class="bottom-logo" src="" style="display:none;"><span id="ftb-home-name" class="bottom-team-name">ХОЗЯЕВА</span></div><div class="bottom-center-spacer"></div><div class="bottom-team-group away"><span id="ftb-away-name" class="bottom-team-name">ГОСТИ</span><img id="ftb-away-logo" class="bottom-logo" src="" style="display:none;"></div><div class="bottom-center-box"><span class="bottom-status-text">МАТЧ ОКОНЧЕН</span><div class="bottom-score-box"><span id="ftb-home-score">0</span><span class="bottom-score-sep">:</span><span id="ftb-away-score">0</span></div></div></div>

    <div id="stats-modular-container"></div>
    <div id="possession-container"><div id="poss-home-bar" class="poss-bar" style="background: #ff0000; width: 50%;">50%</div><div id="poss-away-bar" class="poss-bar" style="background: #00ffff; width: 50%;">50%</div></div>

    <div id="stats-summary-overlay">
        <div class="summary-header"><span id="sum-home-name" class="summary-team-name">ХОЗЯЕВА</span><div class="summary-score"><span id="sum-home-score">0</span> : <span id="sum-away-score">0</span></div><span id="sum-away-name" class="summary-team-name">ГОСТИ</span></div>
        <div id="summary-stats-rows"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBf90bqaBPXIPiU2Y84CV1cVU7hVmxn8Vk", authDomain: "tablok4tv.firebaseapp.com", databaseURL: "https://tablok4tv-default-rtdb.firebaseio.com", projectId: "tablok4tv", storageBucket: "tablok4tv.firebasestorage.app", messagingSenderId: "449837394917", appId: "1:449837394917:web:b5115ffd8de2c001919d0c" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('match');

        let prevHomeScore = -1, prevAwayScore = -1;
        let mainTimerInterval = null, addedTimerInterval = null;

        const statTypes = [
          { key: 'possession', label: 'Владение' },
          { key: 'score', label: 'Счёт' },
          { key: 'shots', label: 'Удары' },
          { key: 'corners', label: 'Угловые' },
          { key: 'offsides', label: 'Оффсайды' },
          { key: 'fouls', label: 'Наруш.' },
          { key: 'yellowCards', label: 'ЖК' },
          { key: 'redCards', label: 'КК' }
        ];

        const summaryRowsContainer = document.getElementById('summary-stats-rows');
        statTypes.forEach(s => {
          summaryRowsContainer.innerHTML += `<div class="summary-row" id="sum-row-${s.key}"><span class="summary-val" id="sum-${s.key}-home">0</span><span class="summary-label">${s.label}</span><span class="summary-val" id="sum-${s.key}-away">0</span></div>`;
        });

        const el = id => document.getElementById(id);
        const setText = (id, v) => { const e = el(id); if (e) e.textContent = v; };
        const num = (v, def) => (typeof v === 'number' && isFinite(v)) ? v : def;
        const hex = (c, def) => (typeof c === 'string' && c.startsWith('#')) ? c : def;

        function formatTime(ms) { const totalSec = Math.max(0, Math.floor(ms / 1000)); const m = Math.floor(totalSec / 60); const s = totalSec % 60; return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; }
        function applyMarker(id, c) { const m = el(id); if (c && c !== 'transparent') { m.style.backgroundColor = c; m.style.display = 'block'; } else { m.style.display = 'none'; } }
        function applyLogo(id, u) { const i = el(id); if (u && typeof u === 'string' && u.trim() !== '') { i.src = u; i.style.display = 'block'; } else { i.style.display = 'none'; } }

        // Первичное создание полной структуры базы
        db.once('value').then(s => {
          if (!s.exists()) {
            db.set({
              homeTeam: "ХОЗЯЕВА", awayTeam: "ГОСТИ",
              homeScore: 0, awayScore: 0,
              homeFormColor: "transparent", awayFormColor: "transparent",
              homeLogo: "", awayLogo: "",
              tournamentName: "",
              design: "1", position: "top-left",
              overlayState: "main",
              timer: { isRunning: false, startTime: 0, elapsed: 0, manualStartMin: 0, maxMinutes: 90 },
              addedTime: { isActive: false, minutes: 0, isRunning: false, startTime: 0, elapsed: 0 },
              colors: { bg: "#1a1a1a", timerFont: "#ffffff", teamFont: "#ffffff" },
              stats: {
                possession: { home: 50, away: 50, isVisible: false },
                score: { isVisible: true },
                shots: { home: 0, away: 0, isVisible: false },
                corners: { home: 0, away: 0, isVisible: false },
                offsides: { home: 0, away: 0, isVisible: false },
                fouls: { home: 0, away: 0, isVisible: false },
                yellowCards: { home: 0, away: 0, isVisible: false },
                redCards: { home: 0, away: 0, isVisible: false }
              }
            });
          }
        });

        db.on('value', snapshot => {
          const d = snapshot.val() || {};
          const timer = d.timer || {};
          const added = d.addedTime || {};
          const colors = d.colors || {};
          const stats = d.stats || {};
          const state = d.overlayState || 'main';

          const homeName = d.homeTeam || 'ХОЗЯЕВА';
          const awayName = d.awayTeam || 'ГОСТИ';
          const homeScore = num(d.homeScore, 0);
          const awayScore = num(d.awayScore, 0);

          /* --- Табло --- */
          setText('homeName', homeName);
          setText('awayName', awayName);
          const hSc = el('homeScore'), aSc = el('awayScore');
          hSc.textContent = homeScore;
          aSc.textContent = awayScore;
          if (prevHomeScore !== -1 && homeScore !== prevHomeScore) { hSc.classList.remove('score-animate'); void hSc.offsetWidth; hSc.classList.add('score-animate'); }
          if (prevAwayScore !== -1 && awayScore !== prevAwayScore) { aSc.classList.remove('score-animate'); void aSc.offsetWidth; aSc.classList.add('score-animate'); }
          prevHomeScore = homeScore; prevAwayScore = awayScore;

          applyMarker('homeMarker', d.homeFormColor);
          applyMarker('awayMarker', d.awayFormColor);

          const sb = el('scoreboard');
          ['design-1', 'design-2', 'design-3', 'design-4'].forEach(c => sb.classList.remove(c));
          sb.classList.add('design-' + (d.design || '1'));
          sb.style.backgroundColor = colors.bg || '#1a1a1a';

          const wrapper = el('wrapper');
          wrapper.classList.remove('pos-top-left', 'pos-top-center', 'pos-top-right');
          wrapper.classList.add('pos-' + (d.position || 'top-left'));

          const teamColor = colors.teamFont || '#ffffff';
          const timerColor = colors.timerFont || '#ffffff';
          el('homeName').style.color = teamColor;
          el('awayName').style.color = teamColor;
          hSc.style.color = teamColor;
          aSc.style.color = teamColor;

          /* --- Таймеры: единая конвенция elapsed + (now - startTime) --- */
          const maxMs = num(timer.maxMinutes, 90) * 60000;
          const manualMs = num(timer.manualStartMin, 0) * 60000;

          const renderMainTimer = () => {
            const live = (timer.isRunning && timer.startTime) ? Date.now() - timer.startTime : 0;
            const total = manualMs + num(timer.elapsed, 0) + live;
            const t = el('timer');
            t.textContent = formatTime(total);
            t.style.color = (maxMs > 0 && total >= maxMs) ? '#ff4d4d' : timerColor;
          };
          const renderAddedTimer = () => {
            const live = (added.isRunning && added.startTime) ? Date.now() - added.startTime : 0;
            setText('addedTimer', formatTime(num(added.elapsed, 0) + live));
          };

          renderMainTimer();

          const atb = el('addedTimeBlock');
          if (added.isActive) {
            atb.style.display = 'block';
            setText('addedTimeVal', '+' + num(added.minutes, 0));
            renderAddedTimer();
          } else {
            atb.style.display = 'none';
          }

          clearInterval(mainTimerInterval);
          clearInterval(addedTimerInterval);
          if (timer.isRunning) mainTimerInterval = setInterval(renderMainTimer, 250);
          if (added.isActive && added.isRunning) addedTimerInterval = setInterval(renderAddedTimer, 250);

          /* --- Сводная статистика --- */
          statTypes.forEach(s => {
            const row = el('sum-row-' + s.key);
            if (!row) return;
            if (s.key === 'possession') {
              setText('sum-possession-home', num(stats.possession && stats.possession.home, 50) + '%');
              setText('sum-possession-away', num(stats.possession && stats.possession.away, 50) + '%');
            } else if (s.key === 'score') {
              setText('sum-score-home', homeScore);
              setText('sum-score-away', awayScore);
              row.style.display = (stats.score && stats.score.isVisible === false) ? 'none' : 'grid';
            } else {
              const node = stats[s.key] || {};
              setText('sum-' + s.key + '-home', num(node.home, 0));
              setText('sum-' + s.key + '-away', num(node.away, 0));
            }
          });

          /* --- Тексты и логотипы больших оверлеев --- */
          ['ns', 'ht', 'ft'].forEach(p => {
            setText(p + '-home-name', homeName);
            setText(p + '-away-name', awayName);
            setText(p + '-home-score', homeScore);
            setText(p + '-away-score', awayScore);
            applyLogo(p + '-home-logo', d.homeLogo);
            applyLogo(p + '-away-logo', d.awayLogo);
            const t = el(p + '-tournament');
            if (d.tournamentName) { t.textContent = d.tournamentName; t.style.display = 'block'; }
            else { t.style.display = 'none'; }
          });
          ['htb', 'ftb'].forEach(p => {
            setText(p + '-home-name', homeName);
            setText(p + '-away-name', awayName);
            setText(p + '-home-score', homeScore);
            setText(p + '-away-score', awayScore);
            applyLogo(p + '-home-logo', d.homeLogo);
            applyLogo(p + '-away-logo', d.awayLogo);
          });

          /* --- Переключение режимов --- */
          const show = (id, on, disp) => { const e = el(id); if (e) e.style.display = on ? disp : 'none'; };
          show('notstarted-overlay', state === 'notstarted', 'flex');
          show('halftime-overlay', state === 'halftime', 'flex');
          show('fulltime-overlay', state === 'fulltime', 'flex');
          show('halftime-bottom-overlay', state === 'halftime-bottom', 'grid');
          show('fulltime-bottom-overlay', state === 'fulltime-bottom', 'grid');
          show('stats-summary-overlay', state === 'stats-summary', 'flex');

          const isMain = state === 'main';
          show('scoreboard-container', isMain, 'block');

          /* --- Модульная статистика (только в основном режиме) --- */
          const mod = el('stats-modular-container');
          mod.innerHTML = '';
          if (isMain) {
            const hC = hex(d.homeFormColor, '#ffffff');
            const aC = hex(d.awayFormColor, '#ffffff');
            statTypes.forEach(s => {
              if (s.key === 'possession' || s.key === 'score') return;
              const node = stats[s.key];
              if (!node || !node.isVisible) return;
              const item = document.createElement('div');
              item.className = 'stat-modular-item';
              item.innerHTML = `<span class="stat-mod-val" style="color:${hC}">${num(node.home, 0)}</span><span class="stat-mod-label">${s.label}</span><span class="stat-mod-val" style="color:${aC}">${num(node.away, 0)}</span>`;
              mod.appendChild(item);
            });
          }
          mod.style.display = mod.children.length ? 'flex' : 'none';

          /* --- Полоса владения --- */
          const poss = el('possession-container');
          const possVisible = isMain && stats.possession && stats.possession.isVisible;
          if (possVisible) {
            const h = num(stats.possession.home, 50);
            const a = num(stats.possession.away, 50);
            const hb = el('poss-home-bar'), ab = el('poss-away-bar');
            hb.style.width = h + '%'; ab.style.width = a + '%';
            hb.textContent = h + '%'; ab.textContent = a + '%';
            hb.style.background = hex(d.homeFormColor, '#ff0000');
            ab.style.background = hex(d.awayFormColor, '#00ffff');
          }
          poss.style.display = possVisible ? 'flex' : 'none';
          mod.style.bottom = (possVisible && mod.children.length) ? '60px' : '40px';
        });
    </script>
</body>
</html>
