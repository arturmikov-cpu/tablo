<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Football Overlay</title>
    <style>
        body { margin: 0; padding: 0; background-color: transparent; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #wrapper { position: absolute; transition: all 0.3s ease; }
        .pos-top-left { top: 40px; left: 40px; } .pos-top-center { top: 40px; left: 50%; transform: translateX(-50%); } .pos-top-right { top: 40px; right: 40px; }

        #scoreboard-container { transition: opacity 0.3s; }
        #scoreboard { display: flex; align-items: center; padding: 12px 35px; border-radius: 8px; gap: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: background-color 0.3s; background-color: #1a1a1a; }
        .team-block { display: flex; align-items: center; gap: 12px; }
        .team-name { font-size: 28px; font-weight: bold; text-transform: uppercase; transition: color 0.3s; color: #ffffff; }
        .form-marker { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); display: none; }
        .score { font-size: 38px; font-weight: 900; transition: color 0.3s; color: #ffffff; min-width: 25px; text-align: center; }
        .timer-container { display: flex; flex-direction: column; align-items: center; }
        .timer-block { font-size: 32px; font-weight: bold; padding: 0 15px; border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3); transition: color 0.3s; color: #ffffff; }
        .added-time-block { font-size: 16px; font-weight: bold; color: #ffdd57; margin-top: 4px; display: none; }
        @keyframes scorePop { 0% { transform: scale(1); } 50% { transform: scale(1.4); filter: brightness(1.5); } 100% { transform: scale(1); } }
        .score-animate { animation: scorePop 0.4s ease-out; }
        .design-1 { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .design-2 { background: rgba(255,255,255,0.1) !important; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        .design-3 { background: #0d0d0d !important; border: 2px solid #00f3ff; box-shadow: 0 0 15px #00f3ff inset, 0 0 15px #00f3ff; }
        .design-4 { border-radius: 50px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .big-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); padding: 60px 120px; border-radius: 20px; display: none; flex-direction: column; align-items: center; gap: 30px; color: white; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 60px rgba(0,0,0,0.8); animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .big-overlay-teams { display: flex; align-items: center; justify-content: center; gap: 50px; width: 100%; }
        .big-team-card { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .big-logo { width: 100px; height: 100px; object-fit: contain; }
        .big-team-name { font-size: 32px; font-weight: bold; text-transform: uppercase; }
        .big-score-block { font-size: 64px; font-weight: 900; display: flex; align-items: center; gap: 20px; }
        .big-score-separator { font-size: 40px; opacity: 0.5; }
        .big-status-text { font-size: 48px; font-weight: 900; letter-spacing: 5px; color: #ffdd57; text-transform: uppercase; text-shadow: 0 0 10px rgba(255, 221, 87, 0.5); }
        .big-tournament-text { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.7); text-align: center; display: none; }

        .bottom-overlay { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 10, 0.75); backdrop-filter: blur(15px); padding: 20px 40px; border-radius: 15px; display: none; grid-template-columns: auto 350px auto; align-items: center; color: white; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 40px rgba(0,0,0,0.8); animation: fadeInBottom 0.5s ease-out; width: fit-content; max-width: 95vw; }
        @keyframes fadeInBottom { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .bottom-team-group { display: flex; align-items: center; gap: 15px; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bottom-team-group.home { justify-content: flex-end; padding-right: 15px; }
        .bottom-team-group.away { justify-content: flex-start; padding-left: 15px; }
        .bottom-logo { width: 50px; height: 50px; object-fit: contain; flex-shrink: 0; }
        .bottom-team-name { font-size: 26px; font-weight: bold; text-transform: uppercase; }
        .bottom-center-box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.95); padding: 12px 35px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 25px rgba(0,0,0,0.6); z-index: 2; max-width: 340px; width: max-content; }
        .bottom-status-text { font-size: 22px; font-weight: 900; color: #ffdd57; text-transform: uppercase; letter-spacing: 2px; }
        .bottom-score-box { background: transparent; padding: 0; border-radius: 0; font-size: 36px; font-weight: 900; display: flex; align-items: center; gap: 15px; }
        .bottom-score-sep { opacity: 0.5; font-size: 24px; }

        #stats-modular-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; gap: 10px; align-items: center; z-index: 50; width: fit-content; }
        .stat-modular-item { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); padding: 10px 30px; border-radius: 10px; display: flex; align-items: center; gap: 30px; color: white; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(0,0,0,0.8); animation: fadeInBottom 0.3s ease-out; }
        .stat-mod-val { font-size: 28px; font-weight: 900; min-width: 30px; text-align: center; }
        .stat-mod-label { font-size: 18px; font-weight: 500; color: #ffdd57; text-transform: uppercase; }

        #possession-container { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 60vw; height: 30px; display: none; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); z-index: 50; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .poss-bar { height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); font-size: 14px; transition: width 0.5s ease; }

        #stats-summary-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); padding: 40px 60px; border-radius: 20px; display: none; flex-direction: column; gap: 20px; color: white; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 60px rgba(0,0,0,0.8); animation: fadeIn 0.5s ease-out; width: 600px; }
        .summary-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.2); margin-bottom: 10px; }
        .summary-team-name { font-size: 24px; font-weight: bold; text-transform: uppercase; }
        .summary-score { font-size: 36px; font-weight: 900; color: #ffdd57; }
        .summary-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 15px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .summary-val { font-size: 22px; font-weight: 900; text-align: center; }
        .summary-label { font-size: 16px; color: rgba(255,255,255,0.6); text-align: center; text-transform: uppercase; }
    </style>
</head>
